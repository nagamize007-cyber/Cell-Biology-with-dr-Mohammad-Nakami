<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell Biology Course</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .course {
      margin-top: 25px;
      padding: 18px;
      background: #f0f2f5;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #2481cc;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Cell Biology</h1>
    <p>with Dr. Mohammed Nagami</p>

    <div class="course">
      <h2>أهلاً بك في الكورس</h2>
      <p id="studentName">مرحباً بالطالب</p>

      <button>المحاضرة الأولى</button>
      <button>المحاضرة الثانية</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {
      document.getElementById("studentName").innerText =
        "أهلاً " + (user.first_name || "");
    }
  </script>

</body>
</html>
